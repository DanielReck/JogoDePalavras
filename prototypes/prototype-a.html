<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Protótipo A — Aura Pop</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f1ff;font-family:system-ui,sans-serif;color:#211b34}.wrap{max-width:390px;margin:auto;min-height:100vh;padding:20px 16px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900}.badge{background:#fff;padding:8px 12px;border-radius:12px}.card{margin-top:36px;background:#fff;border-radius:28px;padding:28px 22px;box-shadow:0 20px 50px #6f5bd522;text-align:center}.ey{font-size:11px;font-weight:900;letter-spacing:.16em;color:#7257ff}h1{font-size:42px;line-height:.95;margin:12px 0;color:#211b34}h1 span{color:#7257ff}p{color:#726985;line-height:1.5}.theme{display:inline-block;background:#eeeaff;padding:8px 12px;border-radius:999px;font-weight:700}.btn{margin-top:16px;background:#7257ff;color:white;border:0;width:100%;height:54px;border-radius:16px;font-weight:900}.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:20px;border-top:1px solid #eee;padding-top:16px}.stats strong{display:block;font-size:22px}.stats small{color:#7a718b}.mini{margin-top:14px;background:#fff;border-radius:22px;padding:18px}.row{display:flex;align-items:center;gap:10px;margin:8px 0;color:#6f6781}.tile{width:38px;height:38px;border-radius:10px;color:#fff;display:grid;place-items:center;font-weight:900}.g{background:#2d936c}.y{background:#b57900}.x{background:#625d70}
</style></head><body><div class="wrap"><div class="top"><div class="logo">✦ Aura Palavra</div><div class="badge">🔥 3</div></div><div class="card"><div class="ey">DESAFIO DE HOJE</div><h1>5 letras.<br><span>6 chances.</span></h1><p>Descubra a palavra do dia e mantenha sua sequência.</p><div class="theme">✦ Tema: memes aurudos</div><button class="btn">Jogar agora →</button><div class="stats"><div><strong>3</strong><small>streak</small></div><div><strong>12</strong><small>vitórias</small></div><div><strong>75%</strong><small>acertos</small></div></div></div><div class="mini"><b>Como jogar</b><div class="row"><span class="tile g">A</span>posição certa</div><div class="row"><span class="tile y">U</span>outra posição</div><div class="row"><span class="tile x">R</span>não aparece</div></div></div></body></html>
